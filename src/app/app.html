@if (linea(); as l) {
  <app-site-header [marca]="l" (abrirCarrito)="abrirCarrito()" />
}

<main>
  <router-outlet />
</main>

@if (linea(); as l) {
  <footer class="rm-footer" [class.rm-footer--con-fab]="mostrarFab()">
    <div class="rm-container rm-footer__inner">
      <div class="rm-footer__brand">
        <img [src]="l.logo" [alt]="l.nombre" />
        <div>
          <strong>{{ l.nombre }}</strong>
          <span>{{ l.eslogan }}</span>
        </div>
      </div>
      <div class="rm-footer__meta">
        @if (empresa.coberturaDelivery) {
          <p class="rm-footer__delivery">🛵 {{ empresa.coberturaDelivery }}</p>
        }
        <p class="rm-footer__legal">© {{ anio }} {{ l.nombre }}. Solo servicio a domicilio.</p>
      </div>
    </div>
  </footer>
}

@if (mostrarFab()) {
  <button type="button" class="rm-fab" (click)="abrirCarrito()">
    <span class="rm-fab__count">{{ cart.totalUnidades() }}</span>
    <span>Ver pedido</span>
    <strong>{{ cart.totalPrecio() | precio }}</strong>
  </button>
}

@if (mostrarVolverArriba()) {
  <button
    type="button"
    class="rm-to-top"
    [class.rm-to-top--con-fab]="mostrarFab()"
    (click)="volverArriba()"
    aria-label="Volver arriba"
    title="Volver arriba"
  >
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 15l-6-6-6 6" />
    </svg>
  </button>
}

<app-cart-drawer [abierto]="carritoAbierto()" (cerrar)="cerrarCarrito()" />
<app-dish-detail />
