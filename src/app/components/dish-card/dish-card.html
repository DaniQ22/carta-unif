<article class="rm-dish" [class.is-active]="cantidad() > 0">
  <button type="button" class="rm-dish__media rm-dish__trigger" (click)="verDetalle()" [attr.aria-label]="'Ver detalle de ' + dish().nombre">
    @if (dish().imagen) {
      <img [src]="dish().imagen" [alt]="dish().nombre" loading="lazy" />
    } @else {
      <span class="rm-dish__mono">{{ iniciales() }}</span>
    }
    @if (dish().destacado) {
      <span class="rm-dish__flag">★ Recomendado</span>
    }
    @if (dish().imagen && dish().imagenes?.length) {
      <span class="rm-dish__fotos" [attr.aria-label]="(dish().imagenes!.length + 1) + ' fotos'">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <path d="m21 15-5-5L5 21" />
        </svg>
        {{ dish().imagenes!.length + 1 }}
      </span>
    }
  </button>

  <div class="rm-dish__body">
    <button type="button" class="rm-dish__info rm-dish__trigger" (click)="verDetalle()">
      <h3 class="rm-dish__name">{{ dish().nombre }}</h3>
      @if (dish().descripcion) {
        <p class="rm-dish__desc">{{ dish().descripcion }}</p>
      }
      @if (dish().ingredientes?.length) {
        <span class="rm-dish__ver-mas">Ver ingredientes</span>
      }
    </button>

    @if (dish().variantes; as variantes) {
      <div class="rm-dish__tamanos">
        @for (v of variantes; track v.id) {
          <button
            type="button"
            class="rm-dish__tamano"
            [class.is-active]="varianteActiva()?.id === v.id"
            (click)="elegirTamano(v.id)"
          >
            {{ v.nombre }}
          </button>
        }
      </div>
    }

    <div class="rm-dish__foot">
      <span class="rm-dish__price">{{ precioMostrado() | precio }}</span>

      @if (tieneOpciones()) {
        <button type="button" class="rm-btn rm-dish__add" (click)="verDetalle()">
          {{ cantidad() > 0 ? 'Elegir otro (' + cantidad() + ')' : 'Elegir' }}
        </button>
      } @else if (cantidad() === 0) {
        <button type="button" class="rm-btn rm-dish__add" (click)="agregar()">Agregar</button>
      } @else {
        <div class="rm-stepper">
          <button type="button" (click)="cart.decrementar(idCarrito())" aria-label="Quitar uno">−</button>
          <span>{{ cantidad() }}</span>
          <button type="button" (click)="cart.incrementar(idCarrito())" aria-label="Agregar uno">+</button>
        </div>
      }
    </div>
  </div>
</article>
