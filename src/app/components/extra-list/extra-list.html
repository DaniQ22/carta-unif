<section class="rm-extra">
  <header class="rm-extra__head">
    <h2>{{ titulo() }}</h2>
    @if (descripcion()) {
      <p>{{ descripcion() }}</p>
    }
  </header>

  <ul class="rm-extra__list">
    @for (item of items(); track item.id) {
      <li class="rm-extra__row" [class.is-active]="cart.cantidadDe(item.id) > 0">
        <div class="rm-extra__info">
          <span class="rm-extra__name">{{ item.nombre }}</span>
          <span class="rm-extra__price">{{ item.precio | precio }}</span>
        </div>

        @if (cart.cantidadDe(item.id) === 0) {
          <button type="button" class="rm-extra__add" (click)="cart.agregar(item)" aria-label="Agregar">
            + Agregar
          </button>
        } @else {
          <div class="rm-stepper rm-stepper--sm">
            <button type="button" (click)="cart.decrementar(item.id)" aria-label="Quitar uno">−</button>
            <span>{{ cart.cantidadDe(item.id) }}</span>
            <button type="button" (click)="cart.incrementar(item.id)" aria-label="Agregar uno">+</button>
          </div>
        }
      </li>
    }
  </ul>
</section>
