<header class="rm-header">
  <div class="rm-container rm-header__inner">
    <a routerLink="/" class="rm-header__brand" [attr.aria-label]="marca().nombre">
      <img class="rm-brandmark" [src]="marca().logo" [alt]="marca().nombre" />
      <span class="rm-header__name">
        <strong>{{ marca().nombre }}</strong>
        <small>{{ marca().eslogan }}</small>
      </span>
    </a>

    <div class="rm-header__actions">
      <button type="button" class="rm-cart-btn" (click)="abrirCarrito.emit()" aria-label="Ver carrito">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
        @if (cart.totalUnidades() > 0) {
          <span class="rm-cart-btn__badge">{{ cart.totalUnidades() }}</span>
        }
      </button>
    </div>
  </div>
</header>
